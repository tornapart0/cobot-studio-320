[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobot-studio-320"
version = "0.2.0b3"
description = "Local Mac workbench for myCobot 320 M5 joint simulation and USB control"
requires-python = ">=3.11"
dependencies = ["pymycobot>=3.9,<4", "pyserial>=3.5,<4"]

[project.scripts]
cobot-studio = "cobot_studio.app:main"

[tool.setuptools.packages.find]
include = ["cobot_studio*"]

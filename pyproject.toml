[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobot-studio-320"
version = "0.4.0b2"
description = "Local Mac workbench for myCobot 320 M5 joint simulation and USB control"
requires-python = ">=3.11"
dependencies = ["pymycobot>=3.9,<4", "pyserial>=3.5,<4"]

[project.optional-dependencies]
vision = ["mediapipe>=0.10.20,<0.11", "opencv-contrib-python>=4.11,<6"]

[project.scripts]
cobot-studio = "cobot_studio.app:main"

[tool.setuptools.packages.find]
include = ["cobot_studio*"]
